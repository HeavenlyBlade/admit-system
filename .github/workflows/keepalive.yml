name: Keep Services Alive

# Runs every 3 days to prevent:
# - Supabase free tier pausing (pauses after 7 days inactivity)
# - Render free tier sleeping (spins down after 15 min inactivity)
# Also runs manually via workflow_dispatch for on-demand wake-up.

on:
  schedule:
    - cron: '0 8 */3 * *'   # Every 3 days at 8:00 AM UTC
  workflow_dispatch:          # Manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging ADMIT backend..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            --retry 3 \
            --retry-delay 10 \
            https://admit-backend.onrender.com/health)

          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Backend is healthy — Supabase and Render are both awake."
          elif [ "$RESPONSE" = "503" ] || [ "$RESPONSE" = "000" ]; then
            echo "⚠️ Backend returned $RESPONSE — Render may be cold-starting. Retrying in 30s..."
            sleep 30
            RETRY=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 60 \
              https://admit-backend.onrender.com/health)
            echo "Retry HTTP status: $RETRY"
            if [ "$RETRY" != "200" ]; then
              echo "❌ Backend still unavailable after retry (status $RETRY)."
              exit 1
            fi
            echo "✅ Backend recovered on retry."
          else
            echo "❌ Unexpected status: $RESPONSE"
            exit 1
          fi

      - name: Log keepalive timestamp
        if: always()
        run: echo "Keepalive ran at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
