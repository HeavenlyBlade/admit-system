name: CI — Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend: Python / pytest
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: pip install pytest==8.3.5 pytest-asyncio==0.25.3 httpx==0.27.2

      - name: Run backend tests
        run: pytest backend/tests/ --tb=short -q
        env:
          DATABASE_URL: postgresql://localhost/admit_test
          GROQ_API_KEY: test-key
          JWT_SECRET: test-jwt-secret-for-ci
          CONFIDENCE_THRESHOLD: '0.35'
          ENVIRONMENT: test

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend: Node 20 / Vitest
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Tests (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
